<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homme de Main — Carte NFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0b0b0d;font-family:'Space Grotesk','Inter',sans-serif;color:#eee;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{
  width:100%;max-width:380px;background:#000;border-radius:24px;overflow:hidden;
  box-shadow:0 24px 70px -24px rgba(0,0,0,.9);text-align:center;position:relative;
  border:1px solid #1c1c1c;
}
/* ===== Header : rayures jaune/noir de chantier ===== */
.top{
  position:relative;padding:44px 20px 40px;
  background:
    repeating-linear-gradient(
      -45deg,
      #ffd62e 0 18px,
      #000 18px 36px
    );
  display:flex;align-items:center;justify-content:center;
}
/* voile sombre pour garder le logo lisible */
.top::after{
  content:"";position:absolute;inset:0;
  background:rgba(0,0,0,.25);pointer-events:none;
}
.top .logo-img{
  width:120px;height:120px;object-fit:contain;
  position:relative;z-index:1;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));
}
.body{padding:24px 22px 28px;background:#000}
h2{font-size:27px;font-weight:800;letter-spacing:-.01em;color:#fff}
.sub{font-size:16px;margin-top:5px;font-weight:700;color:#ffd62e}
.tagline{font-size:14px;font-style:italic;opacity:.6;margin-top:5px;color:#ddd;letter-spacing:.01em}
.saved-badge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;background:rgba(255,214,46,.12);border:1px solid rgba(255,214,46,.35);border-radius:100px;color:#ffd62e;font-size:12px;font-weight:700}.fields{margin:20px 0 18px;display:flex;flex-direction:column;gap:9px;text-align:left}
.f{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:12px;
  font-size:15px;font-weight:600;color:#eee;
  background:#0d0d0d;border:1px solid #262626}
.f svg{width:16px;height:16px;flex:none;color:#ffd62e}
.cta{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:17px;border:none;border-radius:14px;font-family:inherit;font-size:17px;font-weight:800;
  background:#ffd62e;color:#000;cursor:pointer;position:relative;
  box-shadow:0 0 14px rgba(255,214,46,.25),0 0 34px rgba(255,214,46,.1);
  animation:glow 3.6s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{box-shadow:0 0 14px rgba(255,214,46,.25),0 0 34px rgba(255,214,46,.1)}
  50%{box-shadow:0 0 18px rgba(255,214,46,.4),0 0 44px rgba(255,214,46,.16)}
}
.cta:hover{transform:scale(1.03);box-shadow:0 0 22px rgba(255,214,46,.6),0 0 50px rgba(255,214,46,.3)}
.cta svg{width:15px;height:15px;flex:none}
.nav{display:flex;gap:9px;margin-top:10px}
.nav a{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:14px;
  border-radius:12px;text-decoration:none;font-size:15px;font-weight:700;font-family:inherit;
  background:#0d0d0d;border:1px solid #262626;color:#ddd;transition:background .15s;
}
.nav a:hover{background:#161616}
.nav a svg{width:15px;height:15px;color:#ffd62e}
</style>
</head>
<body>

<div class="card">
  <div class="top"><img class="logo-img" src="logo.png" alt="Homme de Main"></div>
  <div class="body">
    <h2>Homme de Main</h2>
    <div class="sub">Jérôme BOY</div>
    <div class="tagline">Vos prestations à domicile en toute confiance</div>
    <div class="saved-badge" id="savedTag" style="display:none">✓ Contact sauvegardé</div>

    <div class="fields">
      <div class="f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>07 67 10 34 34</div>
      <div class="f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>hello@homme-de-main.fr</div>
      <div class="f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>homme-de-main.fr</div>
    </div>

    <button class="cta" id="saveVcf">Enregistrer le contact</button>
    <div class="nav">
      <a href="tel:+33767103434"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>Appeler</a>
      <a href="mailto:hello@homme-de-main.fr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>Email</a>
    </div>
  </div>
</div>

<script>
  const vcf = [
    'BEGIN:VCARD', 'VERSION:3.0',
    'N:BOY;Jérôme;;;', 'FN:Homme de Main',
    'ORG:Homme de Main',
    'TEL;TYPE=VOICE:+33767103434',
    'EMAIL;TYPE=INTERNET:hello@homme-de-main.fr',
    'URL:https://www.homme-de-main.fr/',
    'END:VCARD'
  ].join('\n');
  document.getElementById('saveVcf').addEventListener('click', () => {
    if (window.AndroidBridge) { window.AndroidBridge.saveContact(); }
    const blob = new Blob([vcf], {type:'text/vcard'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'hommedemain.vcf';
    document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
    const t = document.getElementById('savedTag');
    if (t) { t.style.display = ''; t.style.animation = 'pop .3s ease'; }
  });
</script>
</body>
</html>
